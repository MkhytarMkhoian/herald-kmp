# Checks every push and pull request: the tests on the JVM, against the real Android Herald, and in
# the iOS Simulator; the public API; the published artifacts; and the iOS sample app, built against
# the released herald-ios.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Tests on the JVM and in the iOS Simulator, and the API check
        run: SIMULATOR_ID=$(scripts/simulator.sh) ./gradlew check

      - name: Publish to Maven Local
        # Proves every module still makes what Maven Central requires, without uploading anything.
        run: ./gradlew publishToMavenLocal

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-reports
          path: '**/build/reports/tests/'

  sample:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Build the iOS sample app
        run: |
          xcodebuild build -project sample/iosApp/KmpSample.xcodeproj -scheme KmpSample \
            -destination "id=$(scripts/simulator.sh)" -quiet
