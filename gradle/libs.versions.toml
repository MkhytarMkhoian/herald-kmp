[versions]
kotlin = "2.4.20"
agp = "9.4.0"
maven-publish = "0.37.0"
dokka = "2.2.0"
binary-compatibility-validator = "0.18.2"
coroutines = "1.11.0"
# The native SDKs that herald-kmp wraps: herald on Android and the JVM, herald-ios on iOS.
herald-android = "1.4.0"

[libraries]
herald-android-core = { module = "io.github.mkhytarmkhoian:herald-core", version.ref = "herald-android" }
herald-android-log = { module = "io.github.mkhytarmkhoian:herald-log", version.ref = "herald-android" }
herald-android-amplitude = { module = "io.github.mkhytarmkhoian:herald-amplitude", version.ref = "herald-android" }
herald-android-adjust = { module = "io.github.mkhytarmkhoian:herald-adjust", version.ref = "herald-android" }
herald-android-appsflyer = { module = "io.github.mkhytarmkhoian:herald-appsflyer", version.ref = "herald-android" }
herald-android-meta = { module = "io.github.mkhytarmkhoian:herald-meta", version.ref = "herald-android" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "maven-publish" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
binary-compatibility-validator = { id = "org.jetbrains.kotlinx.binary-compatibility-validator", version.ref = "binary-compatibility-validator" }
